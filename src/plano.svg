<svg viewBox="0 0 600 690" role="img" aria-labelledby="pvT pvD" xmlns="http://www.w3.org/2000/svg">
  <title id="pvT">Plano vélico de Kitkat</title>
  <desc id="pvD">Perfil de un velero cutter de 11 metros: un solo mástil con la mayor roja, el yankee blanco con banda roja en el estay de proa y la trinquetilla en el estay interior. Casco blanco con franja bordó, cabina con ventanas, arco de popa y quilla corrida con el timón colgado de ella.</desc>
  <defs>
    <linearGradient id="pvSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--card)"/><stop offset="1" stop-color="var(--paper-2)"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="690" fill="url(#pvSky)"/>
  <!-- agua -->
  <rect x="0" y="560" width="600" height="130" fill="var(--sea)" opacity=".12"/>
  <path d="M0 560 q15 -5 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="var(--sea)" stroke-width="1.2" opacity=".6"/>

  <!-- jarcia fija -->
  <g stroke="var(--muted)" stroke-width="1.1" fill="none">
    <line x1="318" y1="58" x2="500" y2="512"/>          <!-- estay de proa -->
    <line x1="318" y1="170" x2="438" y2="516"/>         <!-- estay interior -->
    <line x1="318" y1="58" x2="112" y2="512"/>          <!-- backstay -->
  </g>

  <!-- mayor (roja) -->
  <path d="M322 70 L322 462 L148 470 Q205 300 322 70 Z" fill="var(--sail)" stroke="var(--burgundy)" stroke-width="1.4" stroke-linejoin="round"/>
  <g stroke="var(--burgundy)" stroke-width=".8" opacity=".55">
    <line x1="322" y1="170" x2="276" y2="176"/><line x1="322" y1="265" x2="236" y2="272"/><line x1="322" y1="360" x2="196" y2="368"/>
  </g>
  <!-- botavara -->
  <line x1="322" y1="466" x2="140" y2="474" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>

  <!-- yankee (blanco, banda roja en baluma y pujamen) -->
  <path d="M332 86 L496 506 L402 402 Z" fill="#fbfaf6" stroke="var(--muted)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M332 86 L402 402 L496 506 L486 500 L396 404 L338 110 Z" fill="var(--sail)"/>
  <!-- trinquetilla -->
  <path d="M326 186 L434 514 L352 452 Z" fill="#f2efe6" stroke="var(--muted)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- mástil -->
  <line x1="320" y1="54" x2="320" y2="520" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
  <line x1="302" y1="190" x2="338" y2="190" stroke="var(--ink)" stroke-width="2"/>  <!-- crucetas -->
  <line x1="306" y1="310" x2="334" y2="310" stroke="var(--ink)" stroke-width="2"/>

  <!-- arco de popa: paneles y eólico -->
  <g stroke="var(--ink)" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M118 512 L124 452 L166 452 L168 510"/>
  </g>
  <rect x="112" y="444" width="62" height="7" rx="1.5" fill="var(--navy)"/>
  <line x1="130" y1="444" x2="130" y2="414" stroke="var(--ink)" stroke-width="2"/>
  <rect x="126" y="409" width="10" height="6" rx="2" fill="var(--ink)"/>
  <g stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"><line x1="126" y1="412" x2="126" y2="399"/><line x1="126" y1="412" x2="126" y2="425" opacity=".5"/></g>

  <!-- pasamanos -->
  <g stroke="var(--muted)" stroke-width="1.2" fill="none">
    <path d="M120 498 L468 494"/>
    <line x1="170" y1="515" x2="170" y2="497"/><line x1="230" y1="514" x2="230" y2="496"/><line x1="380" y1="513" x2="380" y2="495"/><line x1="430" y1="512" x2="430" y2="494"/>
    <path d="M462 511 L470 492 L492 492 L498 506"/>
  </g>

  <!-- cabina -->
  <path d="M226 516 L234 482 L352 480 L362 514 Z" fill="#fbfaf6" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="var(--navy)">
    <rect x="244" y="489" width="20" height="11" rx="2"/><rect x="270" y="489" width="20" height="11" rx="2"/>
    <rect x="296" y="489" width="20" height="11" rx="2"/><rect x="322" y="489" width="20" height="11" rx="2"/>
  </g>

  <!-- casco -->
  <path d="M104 516 Q290 530 506 504 L508 512 Q486 540 452 562 L128 562 Q112 540 104 516 Z" fill="#fbfaf6" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- franja bordó y línea de flotación -->
  <path d="M106 524 Q290 538 505 511 L503 519 Q290 546 108 532 Z" fill="var(--burgundy)"/>
  <path d="M126 555 L456 555 L451 560 L128 560 Z" fill="var(--burgundy)"/>
  <!-- obra viva: quilla corrida con el timón colgado de su borde de popa -->
  <path d="M170 562 L452 562 Q438 574 420 590 Q404 604 384 612 L196 616 L182 612 Z" fill="#7a2f24" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M170 562 L182 612 L196 616 L156 614 Q146 590 150 566 Z" fill="#7a2f24" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="186" cy="578" r="5.5" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1.2"/>
  <path d="M128 562 Q146 563 170 562" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
  <!-- ojos de buey -->
  <g fill="var(--navy)"><circle cx="386" cy="540" r="3"/><circle cx="404" cy="539" r="3"/><circle cx="422" cy="537" r="3"/></g>

  <!-- rótulos -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="600" letter-spacing=".08em">
    <text x="236" y="345" fill="#fbf5ea">MAYOR</text>
    <text x="412" y="300" fill="#5d6672">YANKEE</text>
    <text x="340" y="420" font-size="11" fill="#5d6672">TRINQ.</text>
  </g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="var(--muted)">
    <line x1="104" y1="650" x2="508" y2="650" stroke="var(--muted)" stroke-width="1"/>
    <line x1="104" y1="644" x2="104" y2="656" stroke="var(--muted)"/><line x1="508" y1="644" x2="508" y2="656" stroke="var(--muted)"/>
    <text x="306" y="670" text-anchor="middle">11,25 m</text>
  </g>
</svg>
